<div aria-live="polite" aria-atomic="true">
  @if (feedback(); as f) {
    <button class="feedback-banner" [class.correct]="f.correct" [class.incorrect]="!f.correct" (click)="explanationOpen.set(true)"><span class="feedback-symbol">{{ f.correct ? '✓' : '×' }}</span><div><h2>{{ f.correct ? 'Correct move' : 'Wrong move' }}</h2><p>{{ f.correct ? 'Basic Strategy: ' + f.strategy.recommendedAction : 'Recommended: ' + f.strategy.recommendedAction }}</p><small>Tap to see why</small></div></button>
  } @else {
    <section class="feedback-banner waiting"><span class="feedback-symbol">♠</span><div><h2>המהלך הבא שלך</h2><p>החלטה אחת. עוד צעד קדימה.</p></div></section>
    <section class="recommendation pending"><span class="bulb" aria-hidden="true">♧</span><div><h3>מה המהלך המומלץ?</h3><p>בחרו פעולה כדי לגלות</p></div><span class="tiny-check">?</span></section>
  }
</div>
@if (feedback(); as f) { @if (explanationOpen()) { <div class="mobile-sheet-backdrop explanation-sheet-backdrop" (click)="explanationOpen.set(false)"><section class="mobile-sheet explanation-sheet" (click)="$event.stopPropagation()"><button class="sheet-close" (click)="explanationOpen.set(false)">×</button><h2>Why this move?</h2><p>{{ f.strategy.explanation }}</p></section></div> } }
